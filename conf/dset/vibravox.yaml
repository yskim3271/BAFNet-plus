dataset: Vibravox

# ----------------------------------------------------------------------------
# Vibravox recipe — augmentation unified with conf/dset/taps.yaml.
#
# The augmentation pipeline is identical to TAPS: default snr_random mixing with
# DNS `noise_fullband_16k` at controlled SNR + dB-FS normalization (target
# -25 dBFS, floating +-10, from conf/config.yaml train/valid/test_noise). The
# only differences from TAPS are the speech corpus (Vibravox throat+headset,
# loaded by dataset name in train.py) and `speech_subset`. Keeping the
# augmentation identical lets the TAPS trends be reproduced on an independent
# French throat-microphone corpus with no method-side variable.
# See docs/wiki/concepts/vibravox-literature.md §5.
# ----------------------------------------------------------------------------

# Speech: Vibravox speech_clean (default config: 20,981 train / 2,523 dev / 3,064 test)
speech_subset: null
test_augment_numb: 2

# Noise / RIR — DNS noise_fullband_16k, identical manifests to conf/dset/taps.yaml
noise_dir: /home/yskim/workspace/dataset/datasets_fullband/noise_fullband_16k
noise_train: dataset/taps/noise_train.txt
noise_valid: dataset/taps/noise_dev.txt
noise_test: dataset/taps/noise_test.txt
rir_dir: /home/yskim/workspace/dataset/datasets_fullband/impulse_responses_16k
rir_train: dataset/taps/rir_train.txt
rir_valid: dataset/taps/rir_dev.txt
rir_test: dataset/taps/rir_test.txt

# ----------------------------------------------------------------------------
# Audio-time matching to TAPS — apply at command line:
#   epochs=60 warmup_epochs=12 valid_start_epoch=40
# (60 ep x 46.79 h/ep = 2,807 h ~= TAPS 150 ep x 19.20 h = 2,881 h, 97.5% match)
# ----------------------------------------------------------------------------
